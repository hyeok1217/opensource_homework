name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/face-estimate:latest


deploy:
    needs: docker-build-push
    runs-on: self-hosted
    steps:
      - name: Pull newest image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/face-estimate:latest
        
      - name: Replace running app container
        run: |
          docker stop dog-classifier || true
          docker rm dog-classifier || true
          docker run -d --name dog-classifier -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/face-estimate:latest